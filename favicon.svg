<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#1C1C1C"/>
  <!-- outer ring -->
  <circle cx="16" cy="16" r="8" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- inner dot -->
  <circle cx="16" cy="16" r="2.8" fill="white"/>
  <!-- 12 dots at 30° intervals, radius 12.5 -->
