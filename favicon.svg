  <circle cx="22.25" cy="5.25"  r="1" fill="white"/>
  <circle cx="26.75" cy="10"    r="1" fill="white"/>
  <circle cx="28.5"  cy="16"    r="1" fill="white"/>
  <circle cx="26.75" cy="22"    r="1" fill="white"/>
  <circle cx="22.25" cy="26.75" r="1" fill="white"/>
  <circle cx="16"    cy="28.5"  r="1" fill="white"/>
  <circle cx="9.75"  cy="26.75" r="1" fill="white"/>
  <circle cx="5.25"  cy="22"    r="1" fill="white"/>
  <circle cx="3.5"   cy="16"    r="1" fill="white"/>
  <circle cx="5.25"  cy="10"    r="1" fill="white"/>
  <circle cx="9.75"  cy="5.25"  r="1" fill="white"/>
</svg>
